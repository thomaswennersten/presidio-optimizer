version: "3.8"

services:
  presidio-optimizer-backend:
    build: .
    ports:
      - "172.17.0.1:18010:8000"
    volumes:
      - /opt/app/presidio-optimizer/backend:/app
      - /opt/app/presidio-optimizer/db:/app/db
    restart: always
    environment:
      - PYTHONUNBUFFERED=1
      - UPLOAD_FOLDER=/tmp/uploads
      - CONFIG_DIR=/app/db/sessions
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  presidio-optimizer-frontend:
    image: nginx:alpine
    ports:
      - "172.17.0.1:18011:80"
    volumes:
      - /opt/app/presidio-optimizer/frontend:/usr/share/nginx/html
      - /opt/app/presidio-optimizer/nginx.conf:/etc/nginx/conf.d/default.conf
    restart: always
