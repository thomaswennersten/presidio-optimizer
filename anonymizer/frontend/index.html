<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dokumentanonymisering med Presidio</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Dokumentanonymisering</h1>
            <p>Ladda upp dokument för att ta bort personuppgifter med Microsoft Presidio</p>
        </header>

        <main>
            <div class="upload-section">
                <div class="upload-area" id="uploadArea">
                    <svg class="upload-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12" />
                    </svg>
                    <h3>Dra och släpp filer här</h3>
                    <p>eller</p>
                    <button class="btn-primary" id="browseBtn">Välj filer</button>
                    <input type="file" id="fileInput" accept=".docx,.xlsx,.pdf,.txt" style="display: none;" multiple>
                    <p class="file-types">Stödda format: DOCX, XLSX, PDF, TXT</p>
                </div>
            </div>

            <div class="action-buttons">
                <button class="btn-secondary" id="analyzeBtn" disabled>
                    <span>Analysera</span>
                </button>
                <button class="btn-primary" id="anonymizeBtn" disabled>
                    <span>Anonymisera</span>
                </button>
            </div>

            <div class="files-list" id="filesList"></div>

            <div class="results-section" id="resultsSection" style="display: none;">
                <h2>Resultat</h2>
                <div id="resultsContent"></div>
            </div>

            <div class="loading" id="loading" style="display: none;">
                <div class="spinner"></div>
                <p>Bearbetar dokument...</p>
            </div>
        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
