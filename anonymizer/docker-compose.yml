# Eget projektnamn: verktygen kan köras samtidigt utan att containrarna
# krockar med optimizerns.
name: presidio-anonymizer

services:
  backend:
    build: .
    volumes:
      - ./backend:/app
      - ./frontend:/app/static
    environment:
      - PYTHONUNBUFFERED=1
      - UPLOAD_FOLDER=/tmp/uploads
      - OUTPUT_FOLDER=/tmp/outputs
    restart: unless-stopped
    command: uvicorn main:app --host 0.0.0.0 --port 8000

  frontend:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./frontend:/usr/share/nginx/html
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend
    restart: unless-stopped
