server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://172.17.0.1:18010/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 10M;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    location /health {
        proxy_pass http://172.17.0.1:18010/health;
    }

    # Filerna är bind-monterade och ändras direkt på disk. Utan revalidering
    # serverar webbläsaren gamla js/css ur minnescachen och ändringar "verkar
    # inte fungera". ETag finns redan, så no-cache kostar bara en 304.
    location ~* \.(html|js|css)$ {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri $uri/ /index.html;
    }

    # Testmaterial för att bygga regelverk. Katalogen ska gå att BLÄDDRA i —
    # utan autoindex svarar katalog-URL:en 403 och det ser ut som att filerna
    # saknas, trots att de laddas ned utmärkt med fullständigt filnamn.
    location /testmaterial/ {
        autoindex on;
        autoindex_exact_size off;
        autoindex_localtime on;
    }

    # Facit är markdown. Utan detta får .md ingen mimetyp, laddas ned som
    # binärfil och går inte att läsa i webbläsaren.
    location ~ ^/testmaterial/.*\.md$ {
        default_type text/plain;
        charset utf-8;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
