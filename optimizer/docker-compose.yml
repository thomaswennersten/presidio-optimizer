# Fristående uppsättning: relativa sökvägar och port 8081 på localhost.
# Vår egen drift använder docker-compose.drift.yml, som binder den här
# maskinens brygga och därför inte ingår i repot.
name: presidio-optimizer

services:
  backend:
    build: .
    volumes:
      - ./backend:/app
      - ./db:/app/db
    environment:
      - PYTHONUNBUFFERED=1
      - UPLOAD_FOLDER=/tmp/uploads
      - CONFIG_DIR=/app/db/sessions
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:?ANTHROPIC_API_KEY saknas i .env}
      - APP_PASSWORD=${APP_PASSWORD:?APP_PASSWORD saknas i .env}
    restart: unless-stopped
    command: uvicorn main:app --host 0.0.0.0 --port 8000

  frontend:
    image: nginx:alpine
    ports:
      - "8081:80"
    volumes:
      - ./frontend:/usr/share/nginx/html
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend
    restart: unless-stopped
