server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Tjänstnamnet 'backend' kommer från docker-compose och fungerar var som
    # helst, till skillnad från en hårdkodad värd-IP.
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        client_max_body_size 10M;
        proxy_read_timeout 300s;
    }
    location /health { proxy_pass http://backend:8000/health; }
    location ~* \.(html|js|css)$ { try_files $uri $uri/ /index.html; }
    location / { try_files $uri $uri/ /index.html; }
}
